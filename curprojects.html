<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Current Projects — Tim's Homelab</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .curprj-layout { display:grid; grid-template-columns:280px 1fr; gap:20px; min-height:60vh; }
    .curprj-list-panel { border:1px solid var(--border); border-radius:6px; overflow-y:auto; background:var(--bg2); }
    .list-header { padding:12px 16px; border-bottom:1px solid var(--border); font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.1em; }
    .curprj-detail { border:1px solid var(--border); border-radius:6px; background:var(--bg2); padding:24px; }

    .proj-img-placeholder {
      width:100%; height:180px; background:var(--bg3);
      border:1px dashed var(--border); border-radius:6px;
      display:flex; align-items:center; justify-content:center;
      color:var(--text-dim); font-size:12px; margin-bottom:20px;
    }

    .proj-name { font-size:18px; font-weight:700; color:var(--text-bright); margin-bottom:8px; }
    .proj-purpose { font-size:13px; color:var(--text-dim); margin-bottom:24px; line-height:1.9; }
    .progress-label { font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.1em; margin-bottom:10px; }
    .progress-bar-wrap { background:var(--bg3); border:1px solid var(--border); border-radius:3px; height:10px; overflow:hidden; margin-bottom:6px; }
    .progress-bar { height:100%; background:var(--green); border-radius:3px; transition:width 0.6s ease; }
    .progress-pct { font-size:13px; color:var(--green); }

    @media (max-width:768px) { .curprj-layout { grid-template-columns:1fr; } }
  </style>
</head>
<body class="page-wrapper">

  <header class="site-header">
    <div class="site-title">
      <div class="title-text">
        <h1>Tim's Homelab 🖥️</h1>
        <span>homelab &amp; side projects</span>
      </div>
    </div>
    <div class="site-description">$ curprjs</div>
  </header>

  <!-- Nav Terminal TOP -->
  <div style="padding:16px 32px 0;">
    <div class="terminal">
      <div class="terminal-bar">
        <div class="terminal-dot red"></div>
        <div class="terminal-dot yellow"></div>
        <div class="terminal-dot green"></div>
        <span class="terminal-title">tim@homelab:~/curprjs — navigate</span>
      </div>
      <div class="terminal-body" style="padding:10px 16px;">
        <div id="nav-output" style="font-size:12px;"></div>
        <div class="terminal-line">
          <span class="prompt-user">tim</span><span class="prompt-at">@</span><span class="prompt-host">homelab</span>
          <span style="color:var(--text-dim)">:</span><span class="prompt-path">~/curprjs</span>
          <span style="color:var(--text)">$&nbsp;</span>
          <input id="nav-input" class="terminal-input" type="text" autocomplete="off" spellcheck="false">
        </div>
      </div>
      <div class="cheatsheet">
        <div class="cheatsheet-label">// navigate</div>
        <span class="cmd-hint"><span class="cmd" data-cmd="root">root</span></span>
        <span class="cmd-hint"><span class="cmd" data-cmd="whoistim">whoistim</span></span>
        <span class="cmd-hint"><span class="cmd" data-cmd="prjs">prjs</span></span>
        <span class="cmd-hint"><span class="cmd" data-cmd="goals">goals</span></span>
        <span class="cmd-hint"><span class="cmd" data-cmd="homelab">homelab</span></span>
      </div>
    </div>
  </div>

  <main class="page-content fade-in">
    <div class="page-title">// <span>current projects</span></div>
    <div class="curprj-layout">
      <div class="curprj-list-panel">
        <div class="list-header">// active</div>
        <div id="curprj-list" class="folder-list" style="padding:8px"></div>
      </div>
      <div class="curprj-detail" id="curprj-detail">
        <div style="color:var(--text-dim);font-size:13px">select a project to view progress</div>
      </div>
    </div>
  </main>

  <script src="assets/js/terminal.js"></script>
  <script>
    const CUR_PROJECTS = [
      {
        id: 'portfolio', image: 'assets/img/portfolio.jpg',
        folder: 'tims-homelab-portfolio',
        name: "Tim's Homelab Portfolio",
        purpose: 'This website. A terminal-themed portfolio built with HTML, CSS, and JavaScript. Hosted on Cloudflare Pages.',
        progress: 75,
      },
      {
        id: 'cloudflare-tunnel', image: 'assets/img/farmproject.jpg',
        folder: 'cloudflare-tunnel-farm-app',
        name: 'Cloudflare Tunnel — Farm App',
        purpose: 'Exposing the Farm Management System running on proot Debian to the internet via Cloudflare Quick Tunnel.',
        progress: 40,
      },
    ];

    const list   = document.getElementById('curprj-list');
    const detail = document.getElementById('curprj-detail');

    list.innerHTML = CUR_PROJECTS.map((p,i) => `
      <div class="folder-item ${i===0?'active':''}" data-id="${p.id}">
        <span class="folder-icon">📂</span><span>${p.folder}</span>
      </div>
    `).join('');

    function show(id) {
      const p = CUR_PROJECTS.find(x => x.id === id);
      if (!p) return;
      document.querySelectorAll('.folder-item').forEach(el => el.classList.toggle('active', el.dataset.id === id));
      detail.innerHTML = `
        <div class="fade-in">
          <img src="${p.image}" alt="${p.name}" style="width:100%;height:auto;aspect-ratio:16/9;object-fit:contain;border-radius:6px;border:1px solid var(--border);background:var(--bg3);margin-bottom:20px;">
          <div class="proj-name">${p.name}</div>
          <div class="proj-purpose">${p.purpose}</div>
          <div class="progress-label">// progress</div>
          <div class="progress-bar-wrap">
            <div class="progress-bar" style="width:${p.progress}%"></div>
          </div>
          <div class="progress-pct">${p.progress}% complete</div>
        </div>
      `;
    }

    show(CUR_PROJECTS[0].id);
    list.addEventListener('click', e => {
      const item = e.target.closest('.folder-item');
      if (item) show(item.dataset.id);
    });
  </script>
</body>
</html>
