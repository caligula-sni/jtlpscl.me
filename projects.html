<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects — Tim's Homelab</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .projects-layout { display:grid; grid-template-columns:260px 1fr; gap:20px; min-height:60vh; }
    .project-list-panel { border:1px solid var(--border); border-radius:6px; overflow-y:auto; background:var(--bg2); }
    .list-header { padding:12px 16px; border-bottom:1px solid var(--border); font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.1em; }
    .project-detail-panel { border:1px solid var(--border); border-radius:6px; overflow-y:auto; background:var(--bg2); padding:24px; }
    .proj-img { width:100%; height:auto; aspect-ratio:16/9; object-fit:contain; border-radius:6px; border:1px solid var(--border); background:var(--bg3); margin-bottom:20px; }
    .proj-name { font-size:18px; font-weight:700; color:var(--text-bright); margin-bottom:4px; }
    .proj-date { color:var(--text-dim); font-size:12px; margin-bottom:20px; }
    .proj-section-title { font-size:10px; color:var(--accent); text-transform:uppercase; letter-spacing:0.12em; margin:20px 0 8px; border-bottom:1px solid var(--border); padding-bottom:4px; font-weight:700; }
    .proj-text { font-size:13px; color:var(--text); line-height:1.9; }
    .proj-pre { font-size:12px; color:var(--accent); background:var(--bg3); border:1px solid var(--border); padding:14px; border-radius:4px; overflow-x:auto; line-height:1.7; }
    .proj-table { width:100%; border-collapse:collapse; font-size:12px; }
    .proj-table th { text-align:left; color:var(--text-dim); padding:5px 8px; border-bottom:1px solid var(--border); }
    .proj-table td { padding:5px 8px; color:var(--text); }
    .proj-error { background:var(--bg3); border:1px solid var(--border); border-left:3px solid var(--red); padding:10px 14px; margin-bottom:8px; border-radius:0 4px 4px 0; font-size:13px; }
    .proj-list { padding-left:20px; font-size:13px; line-height:2; }
    .proj-list li { color:var(--text-dim); }
    .proj-list li::marker { color:var(--accent); }
    @media(max-width:768px) { .projects-layout { grid-template-columns:1fr; } .project-list-panel { max-height:200px; } }
  </style>
</head>
<body class="page-wrapper">

<header class="site-header">
  <div class="site-title">
    <div class="title-text"><h1>Tim's Homelab</h1><span>homelab &amp; side projects</span></div>
  </div>
  <div class="header-right">
    <div class="site-description">$ projects</div>
    <div class="theme-toggle" id="theme-toggle">
      <span class="theme-toggle-label" id="theme-label">dark</span>
      <div class="toggle-switch"><div class="toggle-knob"></div></div>
    </div>
  </div>
</header>

<div style="padding:16px 32px 0;">
  <div class="terminal">
    <div class="terminal-bar">
      <div class="terminal-dot red"></div><div class="terminal-dot yellow"></div><div class="terminal-dot green"></div>
      <span class="terminal-title">tim@homelab:~/projects &nbsp;—&nbsp; navigate</span>
    </div>
    <div class="terminal-body" style="padding:10px 16px;">
      <div id="nav-output" style="font-size:12px;"></div>
      <div class="terminal-line">
        <span class="prompt-user">tim</span><span class="prompt-at">@</span><span class="prompt-host">homelab</span>
        <span style="color:var(--text-dim)">:</span><span class="prompt-path">~/projects</span>
        <span style="color:var(--text)">$&nbsp;</span>
        <input id="nav-input" class="terminal-input" type="text" autocomplete="off" spellcheck="false" placeholder="type a command...">
      </div>
    </div>
    <div class="cheatsheet">
      <div class="cheatsheet-label">// navigate</div>
      <span class="cmd-hint"><span class="cmd" data-cmd="home">home</span> <span class="cmd-label">— landing</span></span>
      <span class="cmd-hint"><span class="cmd" data-cmd="whoistim">whoistim</span> <span class="cmd-label">— profile</span></span>
      <span class="cmd-hint"><span class="cmd" data-cmd="current">current</span> <span class="cmd-label">— ongoing</span></span>
      <span class="cmd-hint"><span class="cmd" data-cmd="goals">goals</span> <span class="cmd-label">— goals</span></span>
      <span class="cmd-hint"><span class="cmd" data-cmd="homelab">homelab</span> <span class="cmd-label">— homelab</span></span>
    </div>
  </div>
</div>

<main class="page-content fade-in">
  <div class="page-title"><span class="path">~/</span><span class="current">projects</span></div>
  <div class="projects-layout">
    <div class="project-list-panel">
      <div class="list-header">// project folders</div>
      <div id="project-list" class="folder-list" style="padding:8px"></div>
    </div>
    <div class="project-detail-panel" id="project-detail">
      <div style="color:var(--text-dim);font-size:13px">select a project to view details</div>
    </div>
  </div>
</main>

<script src="assets/js/terminal.js"></script>
<script src="assets/js/projects.js"></script>
</body>
</html>
