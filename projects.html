<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects — Tim's Homelab</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .projects-layout { display: grid; grid-template-columns: 260px 1fr; gap: 24px; height: calc(100vh - 220px); }
    .project-list-panel { border: 1px solid var(--border); border-radius: 6px; overflow-y: auto; background: var(--bg2); }
    .list-header { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; }
    .project-detail-panel { border: 1px solid var(--border); border-radius: 6px; overflow-y: auto; background: var(--bg2); padding: 24px; }
    .proj-name { font-size: 16px; font-weight: 700; color: var(--text-bright); margin-bottom: 4px; }
    .proj-section-title { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; margin: 20px 0 8px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
    .proj-text { font-size: 12px; color: var(--text); line-height: 1.8; }
    .proj-pre { font-size: 11px; color: var(--green); background: var(--bg3); border: 1px solid var(--border); padding: 12px; border-radius: 4px; overflow-x: auto; line-height: 1.6; }
    .proj-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .proj-table th { text-align: left; color: var(--text-dim); padding: 4px 8px; border-bottom: 1px solid var(--border); }
    .proj-table td { padding: 4px 8px; color: var(--text); }
    .proj-error { background: var(--bg3); border: 1px solid var(--border); border-left: 3px solid var(--red); padding: 10px 12px; margin-bottom: 8px; border-radius: 0 4px 4px 0; font-size: 12px; }
    .proj-list { padding-left: 20px; font-size: 12px; color: var(--text); line-height: 2; }
    .proj-list li { color: var(--text-dim); }
    .proj-list li::marker { color: var(--green); }
    @media (max-width: 768px) {
      .projects-layout { grid-template-columns: 1fr; height: auto; }
      .project-list-panel { height: 200px; }
    }
  </style>
</head>
<body class="page-wrapper">

  <header class="site-header">
    <div class="site-title">
      <pre class="ascii-icon">[🖥️]</pre>
      <div class="title-text">
        <h1>Tim's Homelab</h1>
        <span>homelab &amp; side projects</span>
      </div>
    </div>
    <div class="site-description">prjs — accomplished projects</div>
  </header>

  <main class="page-content fade-in">
    <div class="page-title">// <span>projects</span></div>
    <div class="projects-layout">
      <div class="project-list-panel">
        <div class="list-header">// project folders</div>
        <div id="project-list" class="folder-list" style="padding:8px"></div>
      </div>
      <div class="project-detail-panel" id="project-detail">
        <div style="color:var(--text-dim);font-size:12px">select a project to view details</div>
      </div>
    </div>
  </main>

  <div class="nav-terminal">
    <div class="terminal">
      <div class="terminal-bar">
        <div class="terminal-dot red"></div>
        <div class="terminal-dot yellow"></div>
        <div class="terminal-dot green"></div>
        <span class="terminal-title">tim@homelab:~/prjs</span>
      </div>
      <div class="terminal-body">
        <div id="nav-output"></div>
        <div class="terminal-line">
          <span class="prompt-user">tim</span><span class="prompt-at">@</span><span class="prompt-host">homelab</span>
          <span style="color:var(--text-dim)">:</span><span class="prompt-path">~/prjs</span>
          <span style="color:var(--text)">$&nbsp;</span>
          <input id="nav-input" class="terminal-input" type="text" autocomplete="off" spellcheck="false">
        </div>
      </div>
      <div class="cheatsheet">
        <div class="cheatsheet-label">// navigate</div>
        <span class="cmd-hint"><span class="cmd" data-cmd="root">root</span></span>
        <span class="cmd-hint"><span class="cmd" data-cmd="whoistim">whoistim</span></span>
        <span class="cmd-hint"><span class="cmd" data-cmd="curprjs">curprjs</span></span>
        <span class="cmd-hint"><span class="cmd" data-cmd="goals">goals</span></span>
        <span class="cmd-hint"><span class="cmd" data-cmd="homelab">homelab</span></span>
      </div>
    </div>
  </div>

  <script src="assets/js/terminal.js"></script>
  <script src="assets/js/projects.js"></script>
</body>
</html>
